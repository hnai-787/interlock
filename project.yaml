description:
  short: "An NE555-timer and D-flip-flop-based 4-way traffic signal controller, verified in Proteus simulation and on physical hardware."
  long: |
    A 4-way traffic signal controller built entirely from discrete digital
    logic: an NE555 astable timer providing a ~1Hz clock, a 4-bit D-flip-flop
    counter cycling through 16 states, and combinational logic decoding
    those states into 12 LED outputs (red/yellow/green per road). A full
    cycle takes 16 seconds (4 seconds per road: 3s green + 1s yellow).
    Verified both in Proteus simulation and on a physical breadboard/LED
    prototype. Built for a Digital Logic Design course (Air University,
    Semester 2, Spring 2024).

